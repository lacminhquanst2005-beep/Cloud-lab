services:
  backend:
    build: ./server
    container_name: mern-backend
    network_mode: host
    environment:
      MONGODB_URI: ${MONGODB_URI}
  

  frontend:
    build: ./client
    container_name: mern-frontend
    ports:
      - "5173:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
